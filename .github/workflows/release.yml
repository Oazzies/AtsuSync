name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      version:
        description: Custom version (e.g. 0.2.0) — only used when bump is "custom"
        required: false
        type: string
      prerelease:
        description: Mark as pre-release
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Compute and apply version bump
        env:
          BUMP: ${{ inputs.bump }}
          CUSTOM_VERSION: ${{ inputs.version }}
        run: |
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const current = pkg.version;
            const bump = process.env.BUMP;
            let next;
            if (bump === "custom") {
              next = (process.env.CUSTOM_VERSION || "").trim().replace(/^v/i, "");
              if (!/^\d+\.\d+\.\d+$/.test(next)) {
                console.error("Invalid custom version:", process.env.CUSTOM_VERSION, "(expected X.Y.Z)");
                process.exit(1);
              }
            } else {
              const parts = current.split(".").map((n) => Number.parseInt(n, 10));
              if (parts.length !== 3 || parts.some(Number.isNaN)) {
                console.error("Invalid current version in package.json:", current);
                process.exit(1);
              }
              if (bump === "major") next = `${parts[0] + 1}.0.0`;
              else if (bump === "minor") next = `${parts[0]}.${parts[1] + 1}.0`;
              else next = `${parts[0]}.${parts[1]}.${parts[2] + 1}`;
            }

            pkg.version = next;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");

            if (fs.existsSync("package-lock.json")) {
              const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
              lock.version = next;
              if (lock.packages && lock.packages[""]) {
                lock.packages[""].version = next;
              }
              fs.writeFileSync("package-lock.json", JSON.stringify(lock, null, 2) + "\n");
            }

            const manifestPath = "extension/public/manifest.json";
            const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
            manifest.version = next;
            fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + "\n");

            fs.appendFileSync(process.env.GITHUB_ENV, `NEW_VERSION=${next}\nTAG_NAME=v${next}\n`);
            console.log(`Bumped version: ${current} -> ${next} (tag v${next})`);
          '

      - name: Ensure tag does not already exist
        run: |
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists!"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Package release archive
        run: |
          chmod +x setup.sh setup.command scripts/*.sh
          ARCHIVE="atsusync-${TAG_NAME}.zip"
          zip -r "$ARCHIVE" . \
            -x ".git/*" \
               ".github/*" \
               "node_modules/*" \
               "*/node_modules/*" \
               "data/*" \
               "data-verify/*" \
               ".env" \
               "*.log" \
               ".claude/*" \
               ".atsusync-restart"
          unzip -l "$ARCHIVE" | grep "extension/dist/manifest.json"
          echo "ARCHIVE_PATH=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Commit version bump and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json extension/public/manifest.json
          git commit -m "Release ${TAG_NAME}"
          git tag "${TAG_NAME}"
          git push origin HEAD --tags

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          ARGS=("${TAG_NAME}" "${ARCHIVE_PATH}" "--title" "AtsuSync ${TAG_NAME}" "--generate-notes")
          if [ "$PRERELEASE" = "true" ]; then
            ARGS+=("--prerelease")
          fi
          gh release create "${ARGS[@]}"
